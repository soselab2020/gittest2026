    <h2>系所介紹</h2>
    <p>
        國立臺灣海洋大學資訊工程學系，簡稱海大資工，
        致力於培養具備資訊科技專業知識、實作能力、AI協作力的新世代人才。
    </p>

    <h2>主要學習領域</h2>
    <ul>
        <li>程式設計</li>
        <li>資料結構與演算法</li>
        <li>人工智慧</li>
        <li>電腦網路</li>
        <li>資訊安全</li>
        <li>軟體工程</li>
    </ul>

    <h2>未來發展</h2>
    <p>畢業後可以從事以下工作：</p>
    <ol>
        <li>軟體工程師</li>
        <li>人工智慧工程師</li>
        <li>資訊安全工程師</li>
        <li>系統工程師</li>
        <li>資訊相關研究工作</li>
    </ol>
